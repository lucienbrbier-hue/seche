<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sèche">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sèche</title>
<style>
:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--text:#fff;--sub:rgba(235,235,245,.6);--sub2:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6);--accent:#0a84ff;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--teal:#64d2ff;--pink:#ff375f;--indigo:#5e5ce6;
  --bar:rgba(22,22,24,.78);--shadow:none;
}
:root[data-theme="light"]{
  --bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--card3:#e5e5ea;--text:#000;--sub:rgba(60,60,67,.6);--sub2:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);--accent:#007aff;--green:#34c759;--yellow:#ffcc00;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;--teal:#32ade6;--pink:#ff2d55;--indigo:#5856d6;
  --bar:rgba(249,249,249,.85);--shadow:0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);font-size:17px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* layout */
.view{padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
.lt{font-size:34px;font-weight:700;letter-spacing:.37px;margin:6px 0 2px}
.subt{color:var(--sub);font-size:15px;margin-bottom:14px}
.sh{font-size:20px;font-weight:700;margin:26px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.sh small{font-size:15px;font-weight:400;color:var(--sub)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .r{text-transform:none;letter-spacing:0;font-weight:500}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--sub)}
.small{font-size:13px}
.tiny{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.stack>*+*{margin-top:8px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 4px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--sub2);padding:2px 0}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.datenav button.arr{width:36px;height:36px;border-radius:18px;background:var(--card);display:grid;place-items:center;color:var(--accent);font-size:20px}
.datenav button.arr:disabled{opacity:.3}
.datelbl{position:relative;font-weight:600;font-size:17px;text-align:center}
.datelbl input{position:absolute;inset:0;opacity:0;width:100%}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--sub)}
.pill.acc{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}

/* weight stepper */
.wstep{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 2px}
.wstep button{width:46px;height:46px;border-radius:23px;background:var(--card2);font-size:26px;font-weight:400;color:var(--accent);display:grid;place-items:center}
.wstep .wv{display:flex;align-items:baseline;justify-content:center}
.wstep input{width:150px;background:none;border:0;text-align:center;font-size:52px;font-weight:700;letter-spacing:-1px;outline:none;padding:0}
.wstep input::placeholder{color:var(--sub2)}
.wstep .u{font-size:20px;color:var(--sub);font-weight:600;margin-left:2px}
.wmeta{text-align:center;color:var(--sub);font-size:13px;min-height:18px}

/* segmented big choices */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{background:var(--card2);border-radius:14px;padding:12px 4px;text-align:center;font-weight:600;font-size:15px;transition:transform .12s,background .2s}
.choice:active{transform:scale(.96)}
.choice .e{font-size:22px;display:block;margin-bottom:2px}
.choice.on[data-v="1"]{background:color-mix(in srgb,var(--green) 25%,var(--card2));box-shadow:inset 0 0 0 2px var(--green)}
.choice.on[data-v="2"]{background:color-mix(in srgb,var(--yellow) 22%,var(--card2));box-shadow:inset 0 0 0 2px var(--yellow)}
.choice.on[data-v="3"]{background:color-mix(in srgb,var(--red) 22%,var(--card2));box-shadow:inset 0 0 0 2px var(--red)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border-radius:20px;padding:8px 13px;font-size:15px;font-weight:500;transition:transform .1s}
.chip:active{transform:scale(.94)}
.chip b{color:var(--accent);font-weight:600;margin-left:3px}
.chip.on{background:var(--accent);color:#fff}
.chip.on b{color:#fff}
.chip.ghost{background:none;box-shadow:inset 0 0 0 1px var(--sep);color:var(--sub)}

/* protein */
.prot{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:24px;font-weight:700;line-height:1}
.ring .c span{font-size:12px;color:var(--sub)}
.plog{font-size:13px;color:var(--sub);line-height:1.5}

/* inputs */
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:.5px solid var(--sep)}
.field:first-of-type{border-top:0}
.field label{color:var(--text)}
.field input,.field select{background:var(--card2);border:0;border-radius:10px;padding:8px 10px;text-align:right;width:120px;outline:none}
.field input[type=time]{width:110px;text-align:center}
.field input[type=date]{width:150px}
.field .big{font-size:22px;font-weight:600}
.tinput{width:100%;background:var(--card2);border:0;border-radius:12px;padding:11px 12px;outline:none}
textarea.tinput{resize:none;min-height:44px}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font-weight:600;text-align:center}
.btn.sec{background:var(--card2);color:var(--accent)}
.btn.danger{background:var(--card2);color:var(--red)}
.btn:active{opacity:.8}
.link{color:var(--accent);font-weight:500;font-size:15px}
.sleepgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tbox{background:var(--card2);border-radius:14px;padding:10px 12px}
.tbox span{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.tbox input{background:none;border:0;font-size:24px;font-weight:600;width:100%;min-width:0;max-width:100%;outline:none;padding:0;color:var(--text);-webkit-appearance:none;appearance:none;text-align:left}
.tbox input::-webkit-date-and-time-value{text-align:left}

/* stats */
.tile .k{font-size:13px;color:var(--sub);font-weight:500}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.4px;margin-top:2px}
.tile .v small{font-size:15px;color:var(--sub);font-weight:600;margin-left:2px}
.tile .d{font-size:13px;font-weight:600;margin-top:2px}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--sub)}
.coach{display:flex;gap:12px;align-items:flex-start}
.coach .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:19px}
.coach b{display:block;margin-bottom:2px}
.coach p{margin:0;color:var(--sub);font-size:15px}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
:root[data-theme="light"] .seg button.on{background:#fff}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--card3);color:var(--text);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;z-index:2}
.chart .empty{height:120px;display:grid;place-items:center;color:var(--sub);font-size:14px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bigv{font-size:34px;font-weight:700;letter-spacing:-.5px}
.bigv small{font-size:17px;color:var(--sub);font-weight:600}
.pbar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;position:relative;margin:8px 0}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--green);transition:width .4s}
.pbar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--sub)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:2px}
.heat div{width:100%;aspect-ratio:1;border-radius:3px;background:var(--card2);min-width:12px}
.heat .r1{background:var(--green)}.heat .r2{background:var(--yellow)}.heat .r3{background:var(--red)}.heat .r0{background:color-mix(in srgb,var(--accent) 45%,var(--card2))}
.heat .s{box-shadow:inset 0 0 0 2px var(--text)}
.heat .fut{opacity:.25}
.insight{display:flex;gap:12px;padding:10px 0;border-top:.5px solid var(--sep)}
.insight:first-of-type{border-top:0;padding-top:0}
.insight .e{font-size:22px;width:28px;text-align:center;flex:none}
.insight p{margin:0;font-size:15px}
.insight p span{color:var(--sub)}
.jrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:.5px solid var(--sep)}
.jrow:first-child{border-top:0}
.jrow .dt{width:62px;flex:none;font-weight:600;font-size:15px}
.jrow .dt small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.jrow .bd{flex:1;font-size:14px;color:var(--sub);min-width:0}
.jrow .bd b{color:var(--text);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:4px}
.chev{color:var(--sub2);font-size:20px}
.bars .b{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bars .b span{width:62px;color:var(--sub)}
.bars .b div{height:18px;border-radius:5px;background:var(--accent);min-width:4px}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden}
.pgrid .ph{position:relative;aspect-ratio:3/4;background:var(--card2);overflow:hidden}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph span{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px}
.cmp{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--card2);user-select:none;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .top{clip-path:inset(0 0 0 50%)}
.cmp .hand{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 8px rgba(0,0,0,.5)}
.cmp .hand::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:18px;background:#fff;color:#000;display:grid;place-items:center;font-weight:700;font-size:15px}
.cmp .lb{position:absolute;top:10px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px}
.viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;color:#fff}
.viewer .vf{padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--card3);margin:0 auto 10px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet .hd b{font-size:17px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

/* settings */
.glist{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:6px}
.gitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;min-height:44px;border-top:.5px solid var(--sep)}
.gitem:first-child{border-top:0}
.gitem input,.gitem select{background:none;border:0;text-align:right;color:var(--sub);outline:none;width:110px}
.gitem input.wide{width:100%;text-align:left;color:var(--text)}
.ghd{font-size:13px;color:var(--sub);text-transform:uppercase;margin:22px 16px 6px;letter-spacing:.2px}
.gft{font-size:13px;color:var(--sub);margin:6px 16px 0;line-height:1.4}
.del{color:var(--red);font-size:22px;width:28px;flex:none}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--card3);border-radius:16px;transition:.2s}
.switch span::before{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::before{transform:translateX(20px)}
code,.code{font:13px ui-monospace,Menlo,monospace;background:var(--card2);padding:2px 5px;border-radius:5px;word-break:break-all}
ol.steps{padding-left:20px;margin:6px 0;font-size:15px}
ol.steps li{margin:6px 0}

/* guide */
.gtable{width:100%;border-collapse:collapse;font-size:15px}
.gtable td{padding:8px 0;border-top:.5px solid var(--sep)}
.gtable tr:first-child td{border-top:0}
.gtable td:nth-child(2),.gtable td:nth-child(3){text-align:right;white-space:nowrap;padding-left:10px}
.gtable td:nth-child(3){color:var(--accent);font-weight:600}
.gtable .cat td{color:var(--sub);font-size:12px;text-transform:uppercase;font-weight:600;padding-top:16px}
.meal{display:flex;justify-content:space-between;padding:9px 0;border-top:.5px solid var(--sep);gap:10px}
.meal:first-of-type{border-top:0}
.meal small{display:block;color:var(--sub);font-size:13px}
.meal .k{text-align:right;white-space:nowrap;font-weight:600}
.meal .k small{color:var(--accent)}


/* toast & login */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-80px);background:var(--card3);color:var(--text);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:60;transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.logo{width:76px;height:76px;border-radius:18px;background:linear-gradient(145deg,#30d158,#0a84ff);display:grid;place-items:center;margin-bottom:18px;font-size:38px}
.login .tinput{margin-bottom:10px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:4px 0 10px}
.sync{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:16px;font-size:12px;color:var(--sub);z-index:5}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="logo">🔥</div>
  <div class="lt" style="font-size:30px">Sèche</div>
  <p class="muted" style="margin:4px 0 24px">Ton suivi de recomposition. Connecte-toi pour retrouver tes données sur tous tes appareils.</p>
  <input id="lEmail" class="tinput" type="email" placeholder="Email" autocomplete="email" autocapitalize="off">
  <input id="lPass" class="tinput" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password">
  <div id="lErr" class="err"></div>
  <button id="lGo" class="btn">Se connecter</button>
  <button id="lSwitch" class="link" style="margin-top:16px">Première fois ? Créer mon compte</button>
</div>

<div id="app" class="hidden">
  <div id="sync" class="sync"></div>
  <section id="v-today" class="view"></section>
  <section id="v-stats" class="view hidden"></section>
  <section id="v-photos" class="view hidden"></section>
  <section id="v-guide" class="view hidden"></section>
  <section id="v-settings" class="view hidden"></section>
  <nav class="tabbar">
    <button class="tab on" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
    <button class="tab" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
    <button class="tab" data-v="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>Photos</button>
    <button class="tab" data-v="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6"/></svg>Guide</button>
    <button class="tab" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
  </nav>
</div>

<div id="toast" class="toast"></div>
<input id="photoInput" type="file" accept="image/*" multiple class="hidden">

/* ================= Utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };

const dn = s => Math.round(pd(s) / 864e5);
const fromDn = n => iso(new Date(n * 864e5));

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const sgn = (n, d = 1) => n == null || isNaN(n) ? '–' : (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n), d);
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

const tMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); let v = h * 60 + m; if (v < 12 * 60) v += 1440; return v; }; // minutes depuis midi (veille)
const minT = v => { v = ((Math.round(v) % 1440) + 1440) % 1440; return `${Math.floor(v / 60)}h${pad(v % 60)}`; };
const sleepDur = (bed, wake) => { if (!bed || !wake) return null; const b = tMin(bed); const [h, m] = wake.split(':').map(Number); let w = h * 60 + m + 1440; if (w - b > 16 * 60) w -= 1440; const d = w - b; return d > 0 && d < 16 * 60 ? d : null; };
const durT = m => m == null ? '–' : `${Math.floor(m / 60)}h${pad(Math.round(m % 60))}`;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); }

/* ================= Data / sync ================= */
const cacheKey = () => 'seche_cache_' + S.user.id;
function saveCache() { try { localStorage.setItem(cacheKey(), JSON.stringify({ days: S.days, weekly: S.weekly, settings: S.settings, photos: S.photos })); } catch (e) {} }
function loadCache() { try { const c = JSON.parse(localStorage.getItem(cacheKey()) || 'null'); if (c) { S.days = c.days || {}; S.weekly = c.weekly || {}; S.settings = { ...DEFAULTS, ...(c.settings || {}) }; S.photos = c.photos || []; } } catch (e) {} }
const pendKey = () => 'seche_pending_' + S.user.id;

function setPending(p) { try { localStorage.setItem(pendKey(), JSON.stringify(p)); } catch (e) {} }

async function loadAll() {
  const [d, w, p, s] = await Promise.all([
    sb.from('days').select('*').order('date'),
    sb.from('weekly').select('*').order('date'),
    sb.from('photos').select('*').order('date'),
    sb.from('settings').select('*').maybeSingle()
  ]);
  if (d.error || w.error || p.error || s.error) throw (d.error || w.error || p.error || s.error);
  // ne pas écraser ce qui attend d'être envoyé
  const pend = getPending();
  S.days = {}; d.data.forEach(r => { S.days[r.date] = clean(r); });
  S.weekly = {}; w.data.forEach(r => { S.weekly[r.date] = { waist: num(r.waist), neck: num(r.neck), perfs: r.perfs || [] }; });
  S.photos = p.data;
  if (s.data) { S.settings = { ...DEFAULTS, ...(s.data.data || {}) }; S.healthToken = s.data.health_token; }
  Object.entries(pend).forEach(([k, v]) => { if (k.startsWith('d:')) S.days[k.slice(2)] = v.row; if (k.startsWith('w:')) S.weekly[k.slice(2)] = v.row; });
  saveCache();
}
function clean(r) { const o = {}; DAY_FIELDS.forEach(f => { o[f] = r[f] ?? null; }); o.weight = num(o.weight); o.protein_log = o.protein_log || []; return o; }

const timers = {};
function queue(key, row, delay = 500) {
  const p = getPending(); p[key] = { row, del: row === null }; setPending(p); saveCache();
  clearTimeout(timers[key]); timers[key] = setTimeout(flush, delay);
}
let flushing = false;
async function flush() {
  if (flushing) return; flushing = true;
  const p = getPending(); let ok = true;
  for (const [k, v] of Object.entries(p)) {
    let res;
    const [type, id] = [k.slice(0, 1), k.slice(2)];
    if (type === 'd') res = v.del ? await sb.from('days').delete().eq('date', id) : await sb.from('days').upsert({ user_id: S.user.id, date: id, ...v.row, updated_at: new Date().toISOString() });
    else if (type === 'w') res = v.del ? await sb.from('weekly').delete().eq('date', id) : await sb.from('weekly').upsert({ user_id: S.user.id, date: id, ...v.row, updated_at: new Date().toISOString() });
    else if (type === 's') res = await sb.from('settings').upsert({ user_id: S.user.id, data: v.row, updated_at: new Date().toISOString() });
    if (res && !res.error) { const q = getPending(); if (JSON.stringify(q[k]) === JSON.stringify(v)) { delete q[k]; setPending(q); } }
    else ok = false;
  }
  flushing = false;
  setSync(ok ? '' : 'Hors ligne · sera synchronisé');
  if (!ok) { clearTimeout(timers.retry); timers.retry = setTimeout(flush, 15000); }
}
function setSync(t) { $('#sync').textContent = t; }
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.user) { flush(); maybeReload(); } });
let lastLoad = 0;
async function maybeReload() { if (Date.now() - lastLoad < 60000) return; lastLoad = Date.now(); try { await loadAll(); if (S.cur !== today() && !S.dateLocked) S.cur = today(); render(); } catch (e) {} }

function day(date) { return S.days[date] || { weight: null, rating: null, protein: null, protein_log: [], kcal: null, steps: null, bed: null, wake: null, session: null, note: null }; }
function setDay(date, patch) {
  const d = { ...day(date), ...patch };
  const empty = DAY_FIELDS.every(f => f === 'protein_log' ? !d.protein_log.length : d[f] == null || d[f] === '');
  if (empty) { delete S.days[date]; queue('d:' + date, null); }
  else { S.days[date] = d; queue('d:' + date, d); }
}
function setWeek(date, row) { if (row) S.weekly[date] = row; else delete S.weekly[date]; queue('w:' + date, row, 100); }
function saveSettings() { queue('s:x', S.settings, 800); }

/* ================= Calculs ================= */
const sortedDates = o => Object.keys(o).sort();
function weights() { return sortedDates(S.days).filter(d => S.days[d].weight != null).map(d => [d, S.days[d].weight]); }
function avg7At(date, ws = weights()) { const a = ws.filter(([d]) => d <= date && diff(d, date) < 7).map(x => x[1]); return a.length ? avg(a) : null; }
function avgSeries(ws = weights()) { return ws.map(([d]) => [d, avg7At(d, ws)]); }
function linreg(pts) { const n = pts.length; if (n < 2) return null; const mx = avg(pts.map(p => p[0])), my = avg(pts.map(p => p[1])); let a = 0, b = 0; pts.forEach(([x, y]) => { a += (x - mx) * (y - my); b += (x - mx) ** 2; }); if (!b) return null; const s = a / b; return { slope: s, icpt: my - s * mx }; }
function rate(endDate = today(), span = 21) {
  const pts = weights().filter(([d]) => d <= endDate && diff(d, endDate) < span).map(([d, w]) => [dn(d), w]);
  if (pts.length < 3 || pts[pts.length - 1][0] - pts[0][0] < 6) return null;
  return linreg(pts).slope * 7;
}
function lastWeight() { const w = weights(); return w.length ? w[w.length - 1] : null; }
function lastWeekly(field, before = '9999') { const ds = sortedDates(S.weekly).filter(d => d <= before && S.weekly[d][field] != null); return ds.length ? [ds[ds.length - 1], S.weekly[ds[ds.length - 1]][field]] : null; }
function neckVal(at) { const n = lastWeekly('neck', at); return n ? n[1] : st().neck; }
function navy(waist, neck, h = st().height) { if (!waist || !neck || waist <= neck) return null; return 495 / (1.0324 - 0.19077 * Math.log10(waist - neck) + 0.15456 * Math.log10(h)) - 450; }
function weightNear(date) { const a = avg7At(date); if (a != null) return a; const w = weights(); if (!w.length) return null; let best = w[0]; w.forEach(x => { if (Math.abs(diff(x[0], date)) < Math.abs(diff(best[0], date))) best = x; }); return Math.abs(diff(best[0], date)) <= 10 ? best[1] : null; }
function bfSeries() { return sortedDates(S.weekly).filter(d => S.weekly[d].waist).map(d => { const bf = navy(S.weekly[d].waist, neckVal(d)); const w = weightNear(d); return bf != null ? { d, bf, w, fat: w != null ? w * bf / 100 : null, lean: w != null ? w * (1 - bf / 100) : null } : null; }).filter(Boolean); }
function bedTarget(date) {
  const s = st(); const start = tMin(s.bedStart), goal = tMin(s.bedGoal);
  const n = Math.max(0, Math.floor(diff(s.startDate, date) / s.bedStepDays));
  return Math.max(goal, start - n * s.bedStepMin);
}
function perfMetric(p, t) { if (!p || p.reps == null) return null; const load = num(p.load) || 0; if (t === 'charge') return load ? load * (1 + p.reps / 30) : null; return p.reps; }
function protStreak() { let n = 0, d = today(); if (!((day(d).protein || 0) >= st().protMin)) d = addDays(d, -1); while ((day(d).protein || 0) >= st().protMin) { n++; d = addDays(d, -1); } return n; }
function logStreak() { let n = 0, d = today(); if (!S.days[d]) d = addDays(d, -1); while (S.days[d]) { n++; d = addDays(d, -1); } return n; }
function weekDue() { const ds = sortedDates(S.weekly); return !ds.length || diff(ds[ds.length - 1], today()) >= 7; }

/* ================= Charts (SVG maison) ================= */
function chart(el, o) {
  const W = Math.max(280, el.clientWidth || 340), H = o.height || 180, P = { l: 4, r: 42, t: 14, b: 22 };
  const all = []; o.series.forEach(s => s.data.forEach(p => all.push(p)));
  if (!all.filter(p => p[1] != null).length) { el.innerHTML = `<div class="empty">${o.empty || 'Pas encore de données'}</div>`; return; }
  let x0 = o.xMin ?? Math.min(...all.map(p => p[0])), x1 = o.xMax ?? Math.max(...all.map(p => p[0]));
  if (x1 - x0 < 6) { x0 -= 3; x1 += 3; }
  const ys = all.map(p => p[1]).filter(v => v != null).concat(o.extraY || []);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = Math.max((y1 - y0) * 0.18, o.minPad || 0.5);
  y0 = o.yMin ?? y0 - padY; y1 = o.yMax ?? y1 + padY;
  const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), Y = y => P.t + (1 - (y - y0) / (y1 - y0)) * (H - P.t - P.b);
  const yf = o.yFmt || (v => fmt(v, 1));
  let g = '';
  // grille
  const ticks = 4; for (let i = 0; i <= ticks; i++) { const v = y0 + (y1 - y0) * i / ticks, y = Y(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="var(--sep)" stroke-width=".5" ${i ? 'stroke-dasharray="2 3"' : ''}/><text x="${W - P.r + 6}" y="${y + 4}" font-size="11" fill="var(--sub)">${yf(v)}</text>`; }
  // dates
  const nx = 4; for (let i = 0; i < nx; i++) { const x = x0 + (x1 - x0) * (i + .5) / nx; g += `<text x="${X(x)}" y="${H - 5}" font-size="11" fill="var(--sub)" text-anchor="middle">${dShort(fromDn(Math.round(x)))}</text>`; }
  if (o.band) g += `<rect x="${P.l}" width="${W - P.l - P.r}" y="${Y(o.band[1])}" height="${Math.max(1, Y(o.band[0]) - Y(o.band[1]))}" fill="var(--green)" opacity=".12" rx="3"/>`;
  const id = 'g' + Math.random().toString(36).slice(2, 8);
  o.series.forEach(s => {
    const pts = s.data.filter(p => p[1] != null);
    if (s.type === 'bar') { const bw = Math.max(3, (W - P.l - P.r) / (x1 - x0 + 1) * .62); pts.forEach(([x, y]) => { const c = typeof s.color === 'function' ? s.color(y) : s.color; g += `<rect x="${X(x) - bw / 2}" y="${Y(y)}" width="${bw}" height="${Math.max(0, Y(y0) - Y(y))}" rx="${Math.min(3, bw / 2)}" fill="${c}"/>`; }); return; }
    if (s.type === 'dots') { pts.forEach(([x, y]) => { g += `<circle cx="${X(x)}" cy="${Y(y)}" r="${s.r || 3}" fill="${s.color}" opacity="${s.op ?? .45}"/>`; }); return; }
    if (pts.length === 1) { g += `<circle cx="${X(pts[0][0])}" cy="${Y(pts[0][1])}" r="4" fill="${s.color}"/>`; return; }
    let d = '';
    if (s.type === 'step') pts.forEach(([x, y], i) => { d += i ? `H${X(x)}V${Y(y)}` : `M${X(x)},${Y(y)}`; });
    else d = smooth(pts.map(([x, y]) => [X(x), Y(y)]));
    if (s.area) g += `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".32"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${X(pts[pts.length - 1][0])},${Y(y0)}L${X(pts[0][0])},${Y(y0)}Z" fill="url(#${id})"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" stroke-linecap="round" stroke-linejoin="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} opacity="${s.op ?? 1}"/>`;
    if (s.endDot) { const [x, y] = pts[pts.length - 1]; g += `<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`; }
    if (s.dotsAll) pts.forEach(([x, y]) => { g += `<circle cx="${X(x)}" cy="${Y(y)}" r="3.5" fill="${s.color}" stroke="var(--card)" stroke-width="1.5"/>`; });
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<line class="cur" y1="${P.t}" y2="${H - P.b}" stroke="var(--sub)" stroke-width="1" opacity="0"/><circle class="curd" r="5" fill="var(--text)" opacity="0"/></svg><div class="tip hidden"></div>`;
  // scrub
  const main = o.series[o.tipSeries || 0], mp = main.data.filter(p => p[1] != null);
  if (!mp.length) return;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cur = svg.querySelector('.cur'), curd = svg.querySelector('.curd');
  const move = e => {
    const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * W / r.width;
    let best = mp[0]; mp.forEach(p => { if (Math.abs(X(p[0]) - px) < Math.abs(X(best[0]) - px)) best = p; });
    const cx = X(best[0]); cur.setAttribute('x1', cx); cur.setAttribute('x2', cx); cur.setAttribute('opacity', .6);
    curd.setAttribute('cx', cx); curd.setAttribute('cy', Y(best[1])); curd.setAttribute('opacity', 1);
    tip.classList.remove('hidden'); tip.textContent = (o.tipFmt || ((x, y) => `${dShort(fromDn(x))} · ${yf(y)}`))(best[0], best[1]);
    tip.style.left = Math.min(Math.max(cx * r.width / W, 50), r.width - 50) + 'px'; tip.style.top = '-8px';
  };
  const out = () => { tip.classList.add('hidden'); cur.setAttribute('opacity', 0); curd.setAttribute('opacity', 0); };
  svg.addEventListener('pointerdown', move); svg.addEventListener('pointermove', move); svg.addEventListener('pointerleave', out); svg.addEventListener('pointerup', () => setTimeout(out, 1600));
}
function smooth(p) { if (p.length < 3) return 'M' + p.map(q => q.join(',')).join('L'); let d = `M${p[0][0]},${p[0][1]}`; for (let i = 0; i < p.length - 1; i++) { const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2, t = .18; d += `C${p1[0] + (p2[0] - p0[0]) * t},${p1[1] + (p2[1] - p0[1]) * t} ${p2[0] - (p3[0] - p1[0]) * t},${p2[1] - (p3[1] - p1[1]) * t} ${p2[0]},${p2[1]}`; } return d; }
function ring(v, max, color) { const r = 42, c = 2 * Math.PI * r, f = Math.min(1, (v || 0) / max); return `<svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--card2)" stroke-width="10"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" style="transition:stroke-dasharray .5s"/></svg>`; }

/* ================= Vue : Aujourd'hui ================= */

  const dayN = diff(s.startDate, date) + 1;

  const a7 = avg7At(date);

  const prev = day(addDays(date, -1));
  const dur = sleepDur(d.bed, d.wake), tgt = bedTarget(date), tgtNext = bedTarget(addDays(date, 1));
  const v = $('#v-today');
  v.innerHTML = `

  <div class="datenav">
    <button class="arr" id="dPrev">‹</button>

    <button class="arr" id="dNext" ${isToday ? 'disabled' : ''}>›</button>
  </div>
  ${isToday && weekDue() ? `<div class="card" style="background:linear-gradient(135deg,color-mix(in srgb,var(--indigo) 35%,var(--card)),var(--card))"><div class="coach"><div class="ic" style="background:var(--indigo)">📏</div><div style="flex:1"><b>Check-in de la semaine</b><p>Tour de taille + tes 3 perfs. 30 secondes.</p></div></div><button class="btn" style="margin-top:12px" id="openWeek">Faire le check-in</button></div>` : ''}

  <div class="card">
    <h3>Poids du matin <span class="r muted">${a7 != null ? `moy. 7 j : ${fmt(a7)} kg` : 'optionnel'}</span></h3>
    <div class="wstep"><button data-w="-1">−</button><div class="wv"><input id="wIn" inputmode="decimal" placeholder="${lw ? fmt(lw[1]) : '–'}" value="${d.weight != null ? fmt(d.weight) : ''}"><span class="u">kg</span></div><button data-w="1">+</button></div>
    <div class="wmeta" id="wMeta">${d.weight != null && lw ? `${sgn(d.weight - lw[1])} kg vs ${dShort(lw[0])} <span class="muted">— l'eau fait varier ±1 kg, regarde la moyenne</span>` : lw ? `Dernière pesée : ${fmt(lw[1])} kg le ${dShort(lw[0])}` : 'Pèse-toi le matin, à jeun, après les toilettes'}</div>
  </div>

  <div class="card">

function sessionsThisWeek() { const t = pd(today()); const mon = addDays(today(), -((t.getDay() + 6) % 7)); return sortedDates(S.days).filter(d => d >= mon && S.days[d].session).length; }
function bindToday() {
  const date = S.cur;
  $('#dPrev').onclick = () => { S.cur = addDays(S.cur, -1); S.dateLocked = true; renderToday(); };
  $('#dNext').onclick = () => { if (S.cur < today()) { S.cur = addDays(S.cur, 1); S.dateLocked = S.cur !== today(); renderToday(); } };
  $('#dPick').onchange = e => { if (e.target.value) { S.cur = e.target.value > today() ? today() : e.target.value; S.dateLocked = S.cur !== today(); renderToday(); } };
  const wIn = $('#wIn');
  wIn.onchange = () => { const v = num(wIn.value); if (v != null && (v < 30 || v > 200)) { toast('Poids bizarre 🤔'); return; } setDay(date, { weight: v }); toast(v != null ? 'Poids enregistré ✓' : 'Poids supprimé'); renderToday(); };
  $$('[data-w]').forEach(b => b.onclick = () => { let v = num(wIn.value); if (v == null) { const lw = weights().filter(([x]) => x <= date).pop(); v = lw ? lw[1] : st().startWeight; } else v += .1 * +b.dataset.w; wIn.value = fmt(v); clearTimeout(timers.w); timers.w = setTimeout(() => wIn.onchange(), 900); });
  $$('.choice').forEach(b => b.onclick = () => { const r = +b.dataset.v; setDay(date, { rating: day(date).rating === r ? null : r }); renderToday(); });
  $$('[data-f]').forEach(b => b.onclick = () => { const f = st().foods[+b.dataset.f]; addProt(date, f.n, f.g); });
  $('#pFree').onclick = () => { const g = num(prompt('Combien de grammes de protéines ?')); if (g) addProt(date, `${g} g`, Math.round(g)); };
  if ($('#pUndo')) $('#pUndo').onclick = () => { const d = day(date), log = d.protein_log.slice(0, -1); setDay(date, { protein_log: log, protein: log.length ? log.reduce((s, x) => s + x.g, 0) : null }); renderToday(); };
  $$('[data-s]').forEach(b => b.onclick = () => { const x = b.dataset.s; setDay(date, { session: day(date).session === x ? null : x }); renderToday(); });
  if ($('#sNote')) { const n = $('#sNote'); n.oninput = () => { n.style.height = 'auto'; n.style.height = n.scrollHeight + 'px'; clearTimeout(timers.n); timers.n = setTimeout(() => setDay(date, { note: n.value.trim() || null }), 600); }; }
  $('#bed').onchange = e => { setDay(date, { bed: e.target.value || null }); renderToday(); };
  $('#wake').onchange = e => { setDay(date, { wake: e.target.value || null }); renderToday(); };
  if ($('#sameSleep')) $('#sameSleep').onclick = () => { const p = day(addDays(date, -1)); setDay(date, { bed: p.bed, wake: p.wake }); renderToday(); toast('Copié depuis hier'); };
  if ($('#steps')) $('#steps').onchange = e => setDay(date, { steps: num(e.target.value) != null ? Math.round(num(e.target.value)) : null });
  if ($('#kcal')) $('#kcal').onchange = e => setDay(date, { kcal: num(e.target.value) != null ? Math.round(num(e.target.value)) : null });
  if ($('#openWeek')) $('#openWeek').onclick = () => openWeekly(today());
}
function addProt(date, n, g) { const d = day(date), log = [...d.protein_log, { n, g }]; setDay(date, { protein_log: log, protein: log.reduce((s, x) => s + x.g, 0) }); renderToday(); toast(`+${g} g · ${n}`); }

/* ================= Check-in hebdo ================= */
function openWeekly(date) {
  const ex = S.weekly[date], s = st();
  const lastW = lastWeekly('waist'), lastN = lastWeekly('neck');
  const lastPerf = n => { const ds = sortedDates(S.weekly).filter(d => d < date).reverse(); for (const d of ds) { const p = (S.weekly[d].perfs || []).find(x => x.n === n); if (p) return p; } return null; };
  const ov = sheet(`
    <div class="hd"><button class="link" data-close>Annuler</button><b>Check-in</b><button class="link" id="wkSave" style="font-weight:700">OK</button></div>
    <div class="card">
      <div class="field"><label>Date</label><input type="date" id="wkDate" value="${date}" max="${today()}"></div>
      <div class="field"><label>Tour de taille <span class="small muted">au nombril</span></label><input id="wkWaist" inputmode="decimal" placeholder="${lastW ? fmt(lastW[1]) : 'cm'}" value="${ex?.waist != null ? fmt(ex.waist) : ''}"></div>
      <div class="field"><label>Tour de cou <span class="small muted">sous la pomme d'Adam</span></label><input id="wkNeck" inputmode="decimal" placeholder="${lastN ? fmt(lastN[1]) : (s.neck ? fmt(s.neck) : 'cm')}" value="${ex?.neck != null ? fmt(ex.neck) : ''}"></div>
    </div>
    <div class="small muted" style="margin:-4px 4px 12px">Le cou sert à estimer ton % de gras (méthode Navy). Une mesure de temps en temps suffit — il bouge peu.</div>
    <div class="sh" style="margin-top:8px">Perfs <small>meilleure série</small></div>
    <div class="card">
    ${s.exercises.map((e, i) => { const p = (ex?.perfs || []).find(x => x.n === e.n), lp = lastPerf(e.n); return `
      <div style="padding:8px 0;${i ? 'border-top:.5px solid var(--sep)' : ''}">
        <div class="row between"><b>${esc(e.n)}</b><span class="small muted">${lp ? `dernière : ${lp.load ? fmt(lp.load, 1).replace(',0', '') + ' kg × ' : ''}${lp.reps}` : ''}</span></div>
        <div class="row" style="margin-top:8px">
          <input class="tinput" data-ex="${i}" data-k="load" inputmode="decimal" placeholder="${e.t === 'charge' ? 'kg (1 haltère)' : 'Lest kg (0)'}" value="${p?.load ?? ''}">
          <span class="muted">×</span>
          <input class="tinput" data-ex="${i}" data-k="reps" inputmode="numeric" placeholder="Reps" value="${p?.reps ?? ''}">
        </div>
      </div>`; }).join('')}
    </div>
    ${ex ? `<button class="btn danger" id="wkDel">Supprimer ce check-in</button>` : ''}
  `);
  $('#wkSave', ov).onclick = () => {
    const d = $('#wkDate', ov).value || date;
    const perfs = s.exercises.map((e, i) => ({ n: e.n, load: num($(`[data-ex="${i}"][data-k=load]`, ov).value), reps: num($(`[data-ex="${i}"][data-k=reps]`, ov).value) })).filter(p => p.reps != null);
    const row = { waist: num($('#wkWaist', ov).value), neck: num($('#wkNeck', ov).value), perfs };
    if (row.waist == null && row.neck == null && !perfs.length) { toast('Rien à enregistrer'); return; }
    if (d !== date && S.weekly[date]) setWeek(date, null);
    setWeek(d, row); ov.remove(); toast('Check-in enregistré ✓'); render();
  };
  if ($('#wkDel', ov)) $('#wkDel', ov).onclick = () => { if (confirm('Supprimer ce check-in ?')) { setWeek(date, null); ov.remove(); render(); } };
}
function sheet(html) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  ov.onclick = e => { if (e.target === ov || e.target.closest('[data-close]')) ov.remove(); };
  document.body.appendChild(ov); return ov;
}

  ${Object.keys(S.weekly).length ? `<div class="sh">Check-ins hebdo</div><div class="card">${sortedDates(S.weekly).reverse().map(d => { const w = S.weekly[d]; return `<div class="jrow" data-wk="${d}"><div class="dt">${dShort(d)}</div><div class="bd">${w.waist ? `<b>${fmt(w.waist)} cm</b> · ` : ''}${(w.perfs || []).map(p => `${esc(p.n)} ${p.load ? fmt(p.load, 1).replace(',0', '') + '×' : ''}${p.reps}`).join(' · ')}</div><span class="chev">›</span></div>`; }).join('')}</div>` : ''}
  <button class="btn sec" style="margin-top:12px" id="addWeek">+ Nouveau check-in</button>
  `;

  // charts
  const target = [];
  if (s.startWeight) { const st0 = dn(s.startDate); for (let x = Math.max(st0, xMin ?? st0); x <= xMax; x += 7) target.push([x, s.startWeight - (s.rateMin + s.rateMax) / 2 * (x - st0) / 7]); target.push([xMax, s.startWeight - (s.rateMin + s.rateMax) / 2 * (xMax - st0) / 7]); }

const cls = d => d == null || isNaN(d) ? 'flat' : d < -0.05 ? 'down' : d > 0.05 ? 'up' : 'flat';
function rateColor(loss) { const s = st(); if (loss == null) return 'var(--sub)'; if (loss < s.rateMin) return 'var(--orange)'; if (loss > s.rateMax + .1) return 'var(--red)'; return 'var(--green)'; }
function projection(cur, r) { if (cur == null || r == null) return ''; return `à ce rythme : ${fmt(cur + r * 4)} kg dans 4 sem.`; }
function coachCard(r, dayN, waists) {
  const s = st(); let ic = '🧭', col = 'var(--accent)', t, p;
  const loss = r != null ? -r : null;
  const wTrend = waists.length > 1 ? waists[waists.length - 1][1] - waists[Math.max(0, waists.length - 4)][1] : null;
  if (loss == null) { t = 'Calibrage en cours'; p = 'Pèse-toi 3 fois par semaine (le matin, à jeun). Après ~1 semaine je calcule ton rythme, et après 3 semaines je te donne des conseils.'; }
  else if (dayN < 21) { t = `Calibrage · jour ${dayN}/21`; p = `Rythme actuel ${sgn(r, 2)} kg/sem. Les 2–3 premières semaines bougent beaucoup (eau, glycogène) : on ajuste à partir du jour 21.`; ic = '⏳'; }
  else if (loss < s.rateMin) {
    if (wTrend != null && wTrend <= -0.5) { t = 'Le poids stagne, mais la taille baisse 👀'; p = `Ton tour de taille a pris ${sgn(wTrend)} cm récemment : c'est probablement de la recompo (gras ↓, muscle ↑). Tu peux garder le cap encore 1–2 semaines.`; ic = '🧬'; col = 'var(--teal)'; }
    else { t = 'Un peu trop lent'; p = `${sgn(r, 2)} kg/sem pour une cible de −${fmt(s.rateMin, 2)} à −${fmt(s.rateMax, 2)}. Réduis un peu les féculents du soir (≈ ⅓ de portion en moins, ~100–150 kcal) et garde tes protéines.`; ic = '🐢'; col = 'var(--orange)'; }
  }
  else if (loss > s.rateMax + .1) { t = 'Trop rapide'; p = `${sgn(r, 2)} kg/sem : tu risques de perdre du muscle. Mange un peu plus (~150–200 kcal : un skyr + une banane, ou une portion de féculents en plus).`; ic = '⚡️'; col = 'var(--red)'; }
  else { t = 'Parfait, tu es dans la cible'; p = `${sgn(r, 2)} kg/sem. Ne change rien : protéines, séances, sommeil.`; ic = '✅'; col = 'var(--green)'; }

    <table class="gtable">${F.map(([c, rows]) => `<tr class="cat"><td colspan="3">${c}</td></tr>` + rows.map(([n, k, p]) => `<tr><td>${n}</td><td class="num">${k}</td><td class="num">${p} g</td></tr>`).join('')).join('')}</table>
    <p class="small muted" style="margin:12px 0 0">Un kebab-frites ≈ la moitié de ta journée. Ça passe — c'est juste un 🔴, et le lendemain on repart en 🟢.</p>
  </div>

  <div class="card"><h3>Les 5 règles qui font 90 % du job</h3>
    <ol class="steps">
      <li><b>Des protéines à chaque repas</b> — c'est ce qui protège ton muscle pendant la sèche.</li>
      <li><b>Féculents réduits le soir</b>, normaux le midi et autour de la séance.</li>
      <li><b>Garde tes perfs</b> : si tes charges/reps tiennent pendant que le poids baisse, tu perds du gras, pas du muscle.</li>
      <li><b>Dors</b> : le manque de sommeil augmente la faim et freine la récup. Chaque 15 min gagnées comptent.</li>
      <li><b>Regarde la moyenne</b>, jamais une pesée seule : ±1 kg d'eau d'un jour à l'autre, c'est normal.</li>
    </ol>
  </div>
  <p class="small muted" style="text-align:center">Valeurs moyennes indicatives — ce sont des repères, pas une science exacte.</p>`;
}

/* ================= Vue : Réglages ================= */

  const shortcutBody = S.healthToken ? JSON.stringify({ p_token: S.healthToken, p_date: 'AAAA-MM-JJ', p_steps: 0 }) : '';
  v.innerHTML = `
  <div class="lt">Réglages</div>
  <div class="subt">${esc(S.user.email)}</div>

  <div class="ghd">Apparence</div>
  <div class="seg" id="themeSeg" style="margin:0 0 4px">${[['dark', 'Sombre'], ['light', 'Clair'], ['auto', 'Auto']].map(([k, l]) => `<button data-t="${k}" class="${s.theme === k ? 'on' : ''}">${l}</button>`).join('')}</div>

  <div class="ghd">Profil</div>
  <div class="glist">
    ${gnum('height', 'Taille', 'cm')}${gnum('startWeight', 'Poids de départ', 'kg')}
    <div class="gitem"><span>Début de la sèche</span><input type="date" data-k="startDate" value="${s.startDate}" style="width:150px"></div>
    ${gnum('neck', 'Tour de cou', 'cm')}

  <div class="gft">Le tour de cou (mesuré sous la pomme d'Adam) + ton tour de taille = estimation du % de gras.</div>

  <div class="glist">
    ${gnum('kcalMin', 'Calories min', 'kcal')}${gnum('kcalMax', 'Calories max', 'kcal')}${gnum('maint', 'Maintenance', 'kcal')}
    ${gnum('protMin', 'Protéines min', 'g')}${gnum('protMax', 'Protéines max', 'g')}
    ${gnum('rateMin', 'Perte min / sem.', 'kg')}${gnum('rateMax', 'Perte max / sem.', 'kg')}
  </div>

  <div class="ghd">Sommeil</div>
  <div class="glist">
    <div class="gitem"><span>Coucher au départ</span><input type="time" data-k="bedStart" value="${s.bedStart}"></div>
    <div class="gitem"><span>Coucher objectif</span><input type="time" data-k="bedGoal" value="${s.bedGoal}"></div>
    <div class="gitem"><span>Réveil objectif</span><input type="time" data-k="wakeGoal" value="${s.wakeGoal}"></div>
    ${gnum('bedStepMin', 'Avancer de', 'min')}${gnum('bedStepDays', 'Tous les', 'jours')}
  </div>

  <div class="ghd">Boutons protéines</div>
  <div class="glist" id="foodList">${s.foods.map((f, i) => `<div class="gitem"><button class="del" data-delf="${i}">⊖</button><input class="wide" data-fn="${i}" value="${esc(f.n)}"><input data-fg="${i}" inputmode="numeric" value="${f.g}" style="width:56px"><span class="muted">g</span></div>`).join('')}
    <div class="gitem"><button class="link" id="addFood">+ Ajouter un aliment</button></div></div>

  <div class="ghd">Exercices de référence</div>
  <div class="glist">${s.exercises.map((e, i) => `<div class="gitem"><button class="del" data-dele="${i}">⊖</button><input class="wide" data-en="${i}" value="${esc(e.n)}"><select data-et="${i}" style="width:120px"><option value="charge" ${e.t === 'charge' ? 'selected' : ''}>Avec charge</option><option value="pdc" ${e.t === 'pdc' ? 'selected' : ''}>Poids du corps</option></select></div>`).join('')}
    <div class="gitem"><button class="link" id="addEx">+ Ajouter un exercice</button></div></div>
  <div class="gft">Renommer un exercice ne renomme pas l'historique déjà saisi.</div>

  <div class="ghd">Types de séance</div>
  <div class="glist"><div class="gitem"><input class="wide" id="sessIn" value="${esc(s.sessions.join(', '))}"></div></div>
  <div class="gft">Séparés par des virgules.</div>

  <div class="ghd">Écran du jour</div>
  <div class="glist">
    <div class="gitem"><span>Afficher les pas</span><label class="switch"><input type="checkbox" data-b="showSteps" ${s.showSteps ? 'checked' : ''}><span></span></label></div>
    <div class="gitem"><span>Afficher les calories</span><label class="switch"><input type="checkbox" data-b="showKcal" ${s.showKcal ? 'checked' : ''}><span></span></label></div>
  </div>

  <div class="ghd">Raccourci iPhone · pas automatiques</div>
  <div class="card">
    ${S.healthToken ? `
    <p class="small" style="margin-top:0">Un raccourci iPhone peut envoyer tes pas (app Santé) chaque soir, tout seul. Dans l'app <b>Raccourcis</b> :</p>
    <ol class="steps small">
      <li>Onglet <b>Automatisation</b> → <b>+</b> → <b>Heure de la journée</b> → 23:30, tous les jours → <b>Exécuter immédiatement</b>.</li>
      <li>Ajoute <b>Rechercher des échantillons de santé</b> : type <i>Nombre de pas</i>, date de début <i>aujourd'hui</i>. Puis <b>Calculer les statistiques</b> → <i>Somme</i>.</li>
      <li>Ajoute <b>Date actuelle</b> puis <b>Formater la date</b> → format personnalisé <code>yyyy-MM-dd</code>.</li>
      <li>Ajoute <b>Obtenir le contenu de l'URL</b> :<br>URL <code class="code">${SB_URL}/rest/v1/rpc/ingest_health</code><br>Méthode <b>POST</b> · En-têtes : <code>apikey</code> = <code class="code">${SB_KEY}</code> et <code>Content-Type</code> = <code>application/json</code><br>Corps <b>JSON</b> : <code>p_token</code> = ton jeton (texte), <code>p_date</code> = la date formatée, <code>p_steps</code> = la somme (nombre).</li>
    </ol>
    <div class="muted small">Ton jeton (garde-le pour toi) :</div>
    <div class="row" style="margin:6px 0 10px"><code class="code" style="flex:1;padding:8px">${esc(S.healthToken)}</code><button class="link" id="copyTok">Copier</button></div>
    <button class="btn sec" id="newTok">Générer un nouveau jeton</button>`
    : `<p class="small" style="margin-top:0">Active-le pour que ton iPhone envoie tes pas automatiquement chaque soir (via l'app Raccourcis). Je te guide pas à pas.</p><button class="btn" id="newTok">Activer</button>`}
  </div>

  <div class="ghd">Données</div>
  <div class="glist">
    <div class="gitem"><button class="link" id="exp">Exporter en JSON</button><span class="muted small">sauvegarde</span></div>
    <div class="gitem"><button class="link" id="imp">Importer un JSON</button></div>
    <div class="gitem"><button class="link" id="logout" style="color:var(--red)">Se déconnecter</button></div>
  </div>
  <div class="gft">Tes données sont synchronisées dans ton espace Supabase privé. L'export ne contient pas les photos (elles restent en ligne).</div>
  <div style="height:20px"></div>`;
  bindSettings();
}
function gnum(k, l, u) { const v = st()[k]; return `<div class="gitem"><span>${l}</span><span class="row" style="gap:4px"><input data-n="${k}" inputmode="decimal" value="${v == null ? '' : String(v).replace('.', ',')}" placeholder="–" style="width:80px"><span class="muted small" style="width:32px">${u}</span></span></div>`; }
function bindSettings() {
  const s = st();
  $$('#themeSeg button').forEach(b => b.onclick = () => { s.theme = b.dataset.t; applyTheme(); saveSettings(); renderSettings(); });
  $$('[data-n]').forEach(i => i.onchange = () => { s[i.dataset.n] = num(i.value) ?? (i.dataset.n === 'neck' ? null : DEFAULTS[i.dataset.n]); saveSettings(); toast('Enregistré ✓'); });
  $$('[data-k]').forEach(i => i.onchange = () => { if (i.value) { s[i.dataset.k] = i.value; saveSettings(); toast('Enregistré ✓'); } });
  $$('[data-b]').forEach(i => i.onchange = () => { s[i.dataset.b] = i.checked; saveSettings(); });
  $$('[data-fn]').forEach(i => i.onchange = () => { s.foods[+i.dataset.fn].n = i.value.trim() || 'Aliment'; saveSettings(); });
  $$('[data-fg]').forEach(i => i.onchange = () => { s.foods[+i.dataset.fg].g = Math.round(num(i.value) || 0); saveSettings(); });
  $$('[data-delf]').forEach(b => b.onclick = () => { s.foods.splice(+b.dataset.delf, 1); saveSettings(); renderSettings(); });
  $('#addFood').onclick = () => { s.foods.push({ n: 'Nouvel aliment', g: 20 }); saveSettings(); renderSettings(); };
  $$('[data-en]').forEach(i => i.onchange = () => { s.exercises[+i.dataset.en].n = i.value.trim() || 'Exercice'; saveSettings(); });
  $$('[data-et]').forEach(i => i.onchange = () => { s.exercises[+i.dataset.et].t = i.value; saveSettings(); });
  $$('[data-dele]').forEach(b => b.onclick = () => { if (confirm('Retirer cet exercice ? (l\'historique reste)')) { s.exercises.splice(+b.dataset.dele, 1); saveSettings(); renderSettings(); } });
  $('#addEx').onclick = () => { s.exercises.push({ n: 'Muscle-up', t: 'pdc' }); saveSettings(); renderSettings(); };
  $('#sessIn').onchange = e => { const a = e.target.value.split(',').map(x => x.trim()).filter(Boolean); if (a.length) { s.sessions = a; saveSettings(); toast('Enregistré ✓'); } };
  $('#newTok').onclick = async () => { if (S.healthToken && !confirm('L\'ancien jeton ne marchera plus. Continuer ?')) return; const a = new Uint8Array(24); crypto.getRandomValues(a); const t = [...a].map(x => x.toString(16).padStart(2, '0')).join(''); await flush(); const { error } = await sb.from('settings').upsert({ user_id: S.user.id, data: S.settings, health_token: t }); if (error) { toast('Erreur : ' + error.message); return; } S.healthToken = t; renderSettings(); toast('Jeton créé ✓'); };
  if ($('#copyTok')) $('#copyTok').onclick = () => { navigator.clipboard.writeText(S.healthToken).then(() => toast('Copié ✓')); };
  $('#exp').onclick = () => { const data = { app: 'seche', version: 1, exported: new Date().toISOString(), settings: S.settings, days: S.days, weekly: S.weekly, photos: S.photos.map(p => ({ date: p.date, path: p.path, note: p.note })) }; const b = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `seche-${today()}.json`; a.click(); toast('Export prêt ✓'); };
  $('#imp').onclick = () => $('#importInput').click();
  $('#logout').onclick = async () => { if (confirm('Se déconnecter ?')) { await sb.auth.signOut(); location.reload(); } };
}
$('#importInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text()); if (data.app !== 'seche') throw new Error('fichier non reconnu');
    if (!confirm(`Importer ${Object.keys(data.days || {}).length} jours et ${Object.keys(data.weekly || {}).length} check-ins ? Les jours existants seront remplacés.`)) return;
    if (data.settings) { S.settings = { ...DEFAULTS, ...data.settings }; saveSettings(); }
    Object.entries(data.days || {}).forEach(([d, r]) => { S.days[d] = clean(r); queue('d:' + d, S.days[d], 50); });
    Object.entries(data.weekly || {}).forEach(([d, r]) => { S.weekly[d] = r; queue('w:' + d, r, 50); });
    applyTheme(); render(); toast('Import terminé ✓');
  } catch (err) { alert('Import impossible : ' + err.message); }
};

/* ================= Navigation / thème ================= */
function applyTheme() {
  const t = st().theme, dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('meta[name=theme-color]').content = dark ? '#000000' : '#f2f2f7';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => st().theme === 'auto' && applyTheme());
function go(v) {
  S.view = v; $$('.view').forEach(x => x.classList.add('hidden')); $('#v-' + v).classList.remove('hidden');
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v)); window.scrollTo(0, 0); render();
}
function render() {
  if (S.view === 'today') renderToday(); else if (S.view === 'stats') renderStats(); else if (S.view === 'photos') renderPhotos(); else if (S.view === 'guide') renderGuide(); else renderSettings();
}
$$('.tab').forEach(t => t.onclick = () => { if (t.dataset.v === 'today' && S.view === 'today') { S.cur = today(); S.dateLocked = false; } go(t.dataset.v); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => S.view === 'stats' && renderStats(), 200); });

/* ================= Auth ================= */
let signup = false;
$('#lSwitch').onclick = () => { signup = !signup; $('#lGo').textContent = signup ? 'Créer mon compte' : 'Se connecter'; $('#lSwitch').textContent = signup ? 'J\'ai déjà un compte' : 'Première fois ? Créer mon compte'; $('#lErr').textContent = ''; };
$('#lGo').onclick = async () => {
  const email = $('#lEmail').value.trim(), password = $('#lPass').value; $('#lErr').textContent = '';
  if (!email || password.length < 6) { $('#lErr').textContent = 'Email et mot de passe (6 caractères min.)'; return; }
  $('#lGo').disabled = true; $('#lGo').style.opacity = .6;
  const r = signup ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin } }) : await sb.auth.signInWithPassword({ email, password });
  $('#lGo').disabled = false; $('#lGo').style.opacity = 1;
  if (r.error) { $('#lErr').textContent = trErr(r.error.message); return; }
  if (signup && !r.data.session) { $('#lErr').style.color = 'var(--green)'; $('#lErr').textContent = '📩 Compte créé ! Clique sur le lien reçu par mail, puis reviens ici et connecte-toi.'; signup = false; $('#lGo').textContent = 'Se connecter'; return; }
  start(r.data.session.user);
};
function trErr(m) { if (/Invalid login/i.test(m)) return 'Email ou mot de passe incorrect'; if (/not confirmed/i.test(m)) return 'Confirme d\'abord ton email (regarde tes mails, et les spams)'; if (/already registered/i.test(m)) return 'Ce compte existe déjà : connecte-toi'; if (/rate limit/i.test(m)) return 'Trop de tentatives, réessaie dans quelques minutes'; return m; }

async function start(user) {
  S.user = user; S.cur = today();
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  loadCache(); applyTheme(); render();
  try { await loadAll(); lastLoad = Date.now(); applyTheme(); render(); flush(); }
  catch (e) { console.error(e); setSync('Hors ligne · données locales'); }
}
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) start(data.session.user); else { $('#login').classList.remove('hidden'); applyTheme(); }
})();
</script>
